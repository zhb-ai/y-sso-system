<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" role="img" aria-label="SSO 安全认证">
  <defs>
    <linearGradient id="badge" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1d3a6e"/>
      <stop offset="1" stop-color="#0a1933"/>
    </linearGradient>
    <linearGradient id="shield" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#d7e8ee"/>
    </linearGradient>
    <linearGradient id="hole" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6fe0e8"/>
      <stop offset="1" stop-color="#2ba4bf"/>
    </linearGradient>
  </defs>

  <rect x="12" y="12" width="232" height="232" rx="64" fill="url(#badge)"/>

  <!-- 盾牌 -->
  <path d="M128 51 C 174 51 194 81 194 113 C 194 157 156 189 128 205 C 100 189 62 157 62 113 C 62 81 82 51 128 51 Z" fill="url(#shield)"/>
  <!-- 钥匙孔 -->
  <circle cx="128" cy="108" r="20" fill="url(#hole)"/>
  <rect x="117.5" y="125" width="21" height="38" rx="10" fill="url(#hole)"/>
</svg>
